services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-platform-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - ./mosquitto/config/passwordfile:/mosquitto/config/passwordfile:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - estarnet_network

  postgres:
    image: postgres:15
    container_name: iot-platform-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - estarnet_network

  redis:
    image: redis:7-alpine
    container_name: iot-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    networks:
      - estarnet_network

  api:
    build: ./api
    container_name: iot-platform-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    networks:
      - estarnet_network

  mqtt-worker:
    build: ./mqtt-worker
    container_name: iot-platform-mqtt-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mosquitto
      - postgres
      - redis
    networks:
      - estarnet_network

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_TIME_ZONE: ${VITE_TIME_ZONE}
    container_name: iot-platform-dashboard
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    networks:
      - estarnet_network

networks:
  estarnet_network:
    external: true