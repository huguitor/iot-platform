name: iot-platform

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-platform-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IOT_MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${IOT_MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - ./mosquitto/config/passwordfile:/mosquitto/config/passwordfile:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - iot_private

  postgres:
    image: postgres:15
    container_name: iot-platform-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - iot_private

  redis:
    image: redis:7-alpine
    container_name: iot-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    networks:
      - iot_private

  api:
    build: ./api
    ports:
      - "127.0.0.1:${IOT_API_PORT:-18000}:8000"
    container_name: iot-platform-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    networks:
      - iot_private

  mqtt-worker:
    profiles: ["worker"]
    build: ./mqtt-worker
    container_name: iot-platform-mqtt-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - iot_private

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_BASE: ${VITE_API_BASE}
        VITE_TIME_ZONE: ${VITE_TIME_ZONE}
    ports:
      - "127.0.0.1:${IOT_DASHBOARD_PORT:-18080}:80"
    volumes:
      - ./nginx/dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    container_name: iot-platform-dashboard
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    networks:
      - iot_private

networks:
  iot_private:
    driver: bridge
    # Red exclusiva de este proyecto; no se conecta a redes externas.
