# Candidate configuration: use only with docker-compose.mqtt-tls.yml.
# Mosquitto >= 2.1. Do not reload this file into the current deployment.
persistence true
persistence_location /mosquitto/data/
autosave_interval 180
connection_messages true
log_timestamp true
log_dest stdout

# Explicit instances: no global password_file/acl_file fallback between listeners.
plugin_load internal_passwords /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/config/passwordfile
plugin_load internal_acl /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl
plugin_load public_passwords /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/public-auth/passwordfile
plugin_load public_acl /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl-public

# Internal Docker clients still connect to mosquitto:1883.
# Loopback restriction is on the host Docker port, not this container listener.
listener 1883
protocol mqtt
listener_allow_anonymous false
plugin_use internal_passwords
plugin_use internal_acl

listener 9001
protocol websockets
listener_allow_anonymous false
plugin_use internal_passwords
plugin_use internal_acl

listener 8883
protocol mqtt
listener_allow_anonymous false
# Prevent public clients from taking an internal client's global MQTT client ID.
use_username_as_clientid true
plugin_use public_passwords
plugin_use public_acl
certfile /mosquitto/tls/current/fullchain.pem
keyfile /mosquitto/tls/current/privkey.pem
tls_version tlsv1.2
require_certificate false
