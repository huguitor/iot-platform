server {
    listen 80;
    server_name panozoelectronica.com.ar;

    # Política ultra permisiva para desarrollo/pruebas
    add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src * 'unsafe-inline'; img-src * data: blob:; frame-ancestors *;" always;

    # API
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentación
    location /docs { proxy_pass http://api:8000/docs; }
    location /openapi.json { proxy_pass http://api:8000/openapi.json; }

    # Dashboard
    location / {
        proxy_pass http://dashboard:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Para que React Router funcione al refrescar
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}